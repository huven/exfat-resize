# SPDX-License-Identifier: MIT

name: Debian package

on:
  workflow_call:
    inputs:
      source_artifact_name:
        description: Artifact containing the source archive and its checksum
        required: true
        type: string
      package_artifact_name:
        description: Artifact name for the generated Debian packages
        required: true
        type: string
      expected_version:
        description: Optional tag or version that the packages must match
        required: false
        default: ""
        type: string
      retention_days:
        description: Artifact retention days; 0 uses the repository default
        required: false
        default: 0
        type: number

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Debian 12, amd64)
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 30
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}

    steps:
      - name: Install package build and test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            build-essential ca-certificates cmake dpkg-dev exfatprogs gzip \
            libcap2-bin lintian make

      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          path: source-artifacts

      - name: Record builder environment
        run: |
          cat /etc/os-release
          gcc --version
          cmake --version
          cpack --version
          dpkg-deb --version

      - name: Build and test Debian packages
        run: |
          set -eu
          archive=$(find source-artifacts -maxdepth 1 -type f \
            -name 'exfat-resize-*.tar.gz' -print)
          test -n "$archive"
          test "$(printf '%s\n' "$archive" | wc -l)" -eq 1
          checksum=$archive.sha256
          test -f "$checksum"
          (cd source-artifacts && sha256sum --check \
            "${checksum#source-artifacts/}")
          mkdir source-tree
          tar -xzf "$archive" -C source-tree
          source_directory=$(find source-tree -mindepth 1 -maxdepth 1 \
            -type d -name 'exfat-resize-*' -print)
          test -n "$source_directory"
          test "$(printf '%s\n' "$source_directory" | wc -l)" -eq 1
          "$source_directory/tools/build-deb.sh" "$archive" deb-artifacts
          package_version=$(sed -n 's/^package_version=//p' \
            deb-artifacts/DEB_PACKAGE_METADATA)
          build_version=$(sed -n 's/^build_version=//p' \
            deb-artifacts/DEB_PACKAGE_METADATA)
          if [ -n "$EXPECTED_VERSION" ]; then
            expected_version=${EXPECTED_VERSION#v}
            test "$package_version" = "$expected_version"
            test "$build_version" = "$expected_version"
          fi
          "$source_directory/tests/package/deb-install-test.sh" \
            deb-artifacts "$source_directory"

      - name: Upload Debian package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_artifact_name }}
          path: |
            deb-artifacts/*.deb
            deb-artifacts/DEB_SHA256SUMS
            deb-artifacts/DEB_PACKAGE_METADATA
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ inputs.retention_days }}

  ubuntu:
    name: Test packages (Ubuntu 22.04 LTS, amd64)
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 20
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}

    steps:
      - name: Install package test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            ca-certificates cmake g++ exfatprogs gzip libcap2-bin

      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          path: source-artifacts

      - name: Download Debian package artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package_artifact_name }}
          path: deb-artifacts

      - name: Test the Debian 12-built packages
        run: |
          set -eu
          archive=$(find source-artifacts -maxdepth 1 -type f \
            -name 'exfat-resize-*.tar.gz' -print)
          test -n "$archive"
          test "$(printf '%s\n' "$archive" | wc -l)" -eq 1
          checksum=$archive.sha256
          test -f "$checksum"
          (cd source-artifacts && sha256sum --check \
            "${checksum#source-artifacts/}")
          mkdir source-tree
          tar -xzf "$archive" -C source-tree
          source_directory=$(find source-tree -mindepth 1 -maxdepth 1 \
            -type d -name 'exfat-resize-*' -print)
          test -n "$source_directory"
          test "$(printf '%s\n' "$source_directory" | wc -l)" -eq 1
          package_version=$(sed -n 's/^package_version=//p' \
            deb-artifacts/DEB_PACKAGE_METADATA)
          build_version=$(sed -n 's/^build_version=//p' \
            deb-artifacts/DEB_PACKAGE_METADATA)
          if [ -n "$EXPECTED_VERSION" ]; then
            expected_version=${EXPECTED_VERSION#v}
            test "$package_version" = "$expected_version"
            test "$build_version" = "$expected_version"
          fi
          "$source_directory/tests/package/deb-install-test.sh" \
            deb-artifacts "$source_directory"
