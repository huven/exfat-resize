# SPDX-License-Identifier: MIT

name: Test

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: ubuntu-latest
          - name: ARM64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build and exFAT tools
        run: sudo apt-get update && sudo apt-get install --yes cmake exfatprogs exfat-fuse mandoc

      - name: Build and test
        run: make test

      - name: Lint manual page
        run: mandoc -T lint build/exfat-resize.8

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test
        run: make test

      - name: Lint manual page
        run: mandoc -T lint build/exfat-resize.8

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Remove POSIX tools from PATH
        shell: pwsh
        run: |
          $pathEntries = $env:PATH -split [IO.Path]::PathSeparator
          $shDirectories = @($pathEntries | Where-Object {
            $_ -and (Test-Path (Join-Path $_ "sh.exe"))
          })
          if ($shDirectories.Count -eq 0) {
            throw "The runner PATH did not expose sh.exe before filtering"
          }
          $shDirectories | ForEach-Object {
            Write-Host "Removing POSIX shell directory from PATH: $_"
          }

          $filteredPath = ($pathEntries | Where-Object {
            $_ -and $_ -notin $shDirectories
          }) -join [IO.Path]::PathSeparator

          $env:PATH = $filteredPath
          if (Get-Command sh.exe -ErrorAction SilentlyContinue) {
            throw "sh.exe remains available after filtering PATH"
          }

          "PATH=$filteredPath" >> $env:GITHUB_ENV

      - name: Configure CLI, library, and tests without POSIX tools
        shell: pwsh
        run: |
          if (Get-Command sh.exe -ErrorAction SilentlyContinue) {
            throw "sh.exe is unexpectedly available"
          }
          cmake -S . -B build/windows -DEXFAT_RESIZE_BUILD_TESTS=ON

      - name: Build CLI, library, and tests
        run: cmake --build build/windows --config Release --parallel

      - name: Run library and CLI tests
        run: >-
          ctest --test-dir build/windows --build-config Release
          --output-on-failure -L "library|cli|package-native"

  windows-volume-fixture:
    name: Prepare Windows logical-volume fixture
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install exFAT and virtual-disk tools
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          exfatprogs exfat-fuse gdisk qemu-utils

      - name: Prepare an exFAT partition with trailing unallocated space
        run: sh tests/cli/prepare-windows-volume.sh build/windows-volume-fixture

      - name: Upload Windows logical-volume fixture
        uses: actions/upload-artifact@v4
        with:
          name: windows-volume-fixture-${{ github.run_id }}
          path: build/windows-volume-fixture
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  windows-volume:
    name: Windows logical volumes
    needs:
      - windows-binary
      - windows-volume-fixture
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download tested Windows archive
        uses: actions/download-artifact@v4
        with:
          name: windows-binary-ci-${{ github.run_id }}
          path: build/windows-binary

      - name: Extract Windows CLI
        shell: pwsh
        run: |
          $Archives = @(Get-ChildItem build/windows-binary -File `
            -Filter "exfat-resize-*-windows-x86_64.zip")
          if ($Archives.Count -ne 1) {
            throw "Expected one Windows archive, found $($Archives.Count)"
          }
          Expand-Archive -LiteralPath $Archives[0].FullName `
            -DestinationPath build/windows-volume-program
          $Programs = @(Get-ChildItem build/windows-volume-program -Recurse -File `
            -Filter "exfat-resize.exe")
          if ($Programs.Count -ne 1) {
            throw "Expected one Windows CLI, found $($Programs.Count)"
          }
          "EXFAT_RESIZE_WINDOWS_CLI=$($Programs[0].FullName)" >> $env:GITHUB_ENV

      - name: Download Windows logical-volume fixture
        uses: actions/download-artifact@v4
        with:
          name: windows-volume-fixture-${{ github.run_id }}
          path: build/windows-volume-fixture

      - name: Resize through drive-letter and volume-GUID paths
        shell: pwsh
        run: |
          ./tests/cli/windows-volume.ps1 `
            -Program $env:EXFAT_RESIZE_WINDOWS_CLI `
            -Fixture build/windows-volume-fixture/prepared.vhdx `
            -ExpectedHash build/windows-volume-fixture/payload.sha256

  linux-big-endian:
    name: Linux (s390x, big endian)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install s390x compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake gcc-s390x-linux-gnu qemu-user

      - name: Build and test library
        run: |
          cmake -S . -B build/s390x \
            -DEXFAT_RESIZE_BUILD_CLI=OFF \
            -DEXFAT_RESIZE_BUILD_TESTS=ON \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=s390x \
            -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=/usr/bin/qemu-s390x;-L;/usr/s390x-linux-gnu"
          cmake --build build/s390x --parallel
          ctest --test-dir build/s390x --output-on-failure

  sanitizers:
    name: Linux (Clang, ASan/UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Clang and exFAT tools
        run: sudo apt-get update && sudo apt-get install --yes clang cmake exfatprogs exfat-fuse

      - name: Build and test with sanitizers
        run: CC=clang CXX=clang++ make sanitize-test

  release-package:
    name: Release package consumers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: macOS
            os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes cmake g++

      - name: Build and test the release package
        run: CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} make release-test

      - name: Upload source package for Linux binary build
        if: matrix.name == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: source-ci-${{ github.run_id }}
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  linux-binary:
    name: Linux binary archive
    needs: release-package
    uses: ./.github/workflows/linux-binary.yml
    with:
      source_artifact_name: source-ci-${{ github.run_id }}
      binary_artifact_name: linux-binary-ci-${{ github.run_id }}
      retention_days: 1

  windows-binary:
    name: Windows binary archive
    needs: release-package
    uses: ./.github/workflows/windows-binary.yml
    with:
      source_artifact_name: source-ci-${{ github.run_id }}
      binary_artifact_name: windows-binary-ci-${{ github.run_id }}
      retention_days: 1
