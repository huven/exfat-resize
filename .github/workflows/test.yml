# SPDX-License-Identifier: MIT

name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: ubuntu-latest
          - name: ARM64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build and exFAT tools
        run: sudo apt-get update && sudo apt-get install --yes cmake exfatprogs exfat-fuse mandoc

      - name: Build and test
        run: make test

      - name: Lint manual page
        run: mandoc -T lint build/exfat-resize.8

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test
        run: make test

      - name: Lint manual page
        run: mandoc -T lint build/exfat-resize.8

  windows:
    name: Windows (MSVC, library)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Remove POSIX tools from PATH
        shell: pwsh
        run: |
          $pathEntries = $env:PATH -split [IO.Path]::PathSeparator
          $shDirectories = @($pathEntries | Where-Object {
            $_ -and (Test-Path (Join-Path $_ "sh.exe"))
          })
          if ($shDirectories.Count -eq 0) {
            throw "The runner PATH did not expose sh.exe before filtering"
          }
          $shDirectories | ForEach-Object {
            Write-Host "Removing POSIX shell directory from PATH: $_"
          }

          $filteredPath = ($pathEntries | Where-Object {
            $_ -and $_ -notin $shDirectories
          }) -join [IO.Path]::PathSeparator

          $env:PATH = $filteredPath
          if (Get-Command sh.exe -ErrorAction SilentlyContinue) {
            throw "sh.exe remains available after filtering PATH"
          }

          "PATH=$filteredPath" >> $env:GITHUB_ENV

      - name: Configure library and tests without POSIX tools
        shell: pwsh
        run: |
          if (Get-Command sh.exe -ErrorAction SilentlyContinue) {
            throw "sh.exe is unexpectedly available"
          }
          cmake -S . -B build/windows -DEXFAT_RESIZE_BUILD_TESTS=ON

      - name: Build library and tests
        run: cmake --build build/windows --config Release --parallel

      - name: Run library tests
        run: >-
          ctest --test-dir build/windows --build-config Release
          --output-on-failure -L library

  linux-big-endian:
    name: Linux (s390x, big endian)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install s390x compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake gcc-s390x-linux-gnu qemu-user

      - name: Build and test library
        run: |
          cmake -S . -B build/s390x \
            -DEXFAT_RESIZE_BUILD_CLI=OFF \
            -DEXFAT_RESIZE_BUILD_TESTS=ON \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=s390x \
            -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=/usr/bin/qemu-s390x;-L;/usr/s390x-linux-gnu"
          cmake --build build/s390x --parallel
          ctest --test-dir build/s390x --output-on-failure

  sanitizers:
    name: Linux (Clang, ASan/UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Clang and exFAT tools
        run: sudo apt-get update && sudo apt-get install --yes clang cmake exfatprogs exfat-fuse

      - name: Build and test with sanitizers
        run: CC=clang CXX=clang++ make sanitize-test

  release-package:
    name: Release package consumers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: macOS
            os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes cmake g++

      - name: Build and test the release package
        run: CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} make release-test

  debian-package:
    name: Debian package (Debian 12, amd64)
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 30

    steps:
      - name: Install package build and test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            build-essential ca-certificates cmake dpkg-dev exfatprogs git \
            gzip libcap2-bin lintian make

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record builder environment
        run: |
          cat /etc/os-release
          gcc --version
          cmake --version
          cpack --version
          dpkg-deb --version

      - name: Trust the runner-mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test Debian packages
        run: |
          set -eu
          make dist
          archive=$(find dist -maxdepth 1 -type f \
            -name 'exfat-resize-*.tar.gz' -print)
          test "$(printf '%s\n' "$archive" | wc -l)" -eq 1
          tools/build-deb.sh "$archive" deb-artifacts
          package_version=$(sed -n '1p' deb-artifacts/DEB_PACKAGE_VERSIONS)
          build_version=$(sed -n '2p' deb-artifacts/DEB_PACKAGE_VERSIONS)
          tests/package/deb-install-test.sh deb-artifacts \
            "$package_version" "$build_version" "$PWD"

      - name: Upload Debian package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deb-artifacts/*.deb
            deb-artifacts/DEB_SHA256SUMS
            deb-artifacts/DEB_PACKAGE_VERSIONS
          if-no-files-found: error
          retention-days: 1

  ubuntu-package:
    name: Debian package (Ubuntu 22.04 LTS, amd64)
    needs: debian-package
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 20

    steps:
      - name: Install package test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            ca-certificates cmake g++ exfatprogs git gzip libcap2-bin

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Debian package artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: deb-artifacts

      - name: Test the Debian 12-built packages
        run: |
          set -eu
          package_version=$(sed -n '1p' deb-artifacts/DEB_PACKAGE_VERSIONS)
          build_version=$(sed -n '2p' deb-artifacts/DEB_PACKAGE_VERSIONS)
          tests/package/deb-install-test.sh deb-artifacts \
            "$package_version" "$build_version" "$PWD"
