# SPDX-License-Identifier: MIT

name: Source release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_source:
    name: Build source release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_REF: ${{ github.ref_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake g++

      - name: Validate release tag and commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          release_commit=$(git rev-parse --verify 'HEAD^{commit}')
          if ! git merge-base --is-ancestor \
            "$release_commit" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "release commit is not reachable from $DEFAULT_BRANCH" >&2
            exit 1
          fi
          tools/release-check.sh --require-signed-tag \
            "$RELEASE_REF" "$release_commit"

      - name: Test release package
        run: make release-test

      - name: Verify source artifacts
        id: artifacts
        run: |
          set -euo pipefail
          version=${RELEASE_REF#v}
          archive=exfat-resize-$version.tar.gz
          checksum=$archive.sha256
          cd dist
          test -f "$archive"
          test -f "$checksum"
          sha256sum --check "$checksum"
          printf 'archive=%s\n' "$archive" >>"$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >>"$GITHUB_OUTPUT"

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            dist/${{ steps.artifacts.outputs.archive }}
            dist/${{ steps.artifacts.outputs.checksum }}
          if-no-files-found: error

  build_deb:
    name: Build Debian packages (Debian 12, amd64)
    needs: build_source
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 30
    env:
      RELEASE_REF: ${{ github.ref_name }}

    steps:
      - name: Install package build and test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            build-essential ca-certificates cmake dpkg-dev exfatprogs gzip \
            libcap2-bin lintian make

      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: source-artifacts

      - name: Record builder environment
        run: |
          cat /etc/os-release
          gcc --version
          cmake --version
          cpack --version
          dpkg-deb --version

      - name: Build and test Debian packages
        run: |
          set -eu
          version=${RELEASE_REF#v}
          archive=source-artifacts/exfat-resize-$version.tar.gz
          (cd source-artifacts && sha256sum --check \
            "exfat-resize-$version.tar.gz.sha256")
          mkdir source-tree
          tar -xzf "$archive" -C source-tree
          source_directory=source-tree/exfat-resize-$version
          "$source_directory/tools/build-deb.sh" "$archive" deb-artifacts
          package_version=$(sed -n '1p' deb-artifacts/DEB_PACKAGE_VERSIONS)
          build_version=$(sed -n '2p' deb-artifacts/DEB_PACKAGE_VERSIONS)
          test "$package_version" = "$version"
          test "$build_version" = "$version"
          "$source_directory/tests/package/deb-install-test.sh" \
            deb-artifacts "$package_version" "$build_version" \
            "$source_directory"

      - name: Upload Debian package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            deb-artifacts/*.deb
            deb-artifacts/DEB_SHA256SUMS
            deb-artifacts/DEB_PACKAGE_VERSIONS
          if-no-files-found: error

  test_deb_ubuntu:
    name: Test Debian packages (Ubuntu 22.04 LTS, amd64)
    needs:
      - build_source
      - build_deb
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 20
    env:
      RELEASE_REF: ${{ github.ref_name }}

    steps:
      - name: Install package test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            ca-certificates cmake g++ exfatprogs gzip libcap2-bin

      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: source-artifacts

      - name: Download Debian package artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: deb-artifacts

      - name: Test the Debian 12-built packages
        run: |
          set -eu
          version=${RELEASE_REF#v}
          archive=source-artifacts/exfat-resize-$version.tar.gz
          (cd source-artifacts && sha256sum --check \
            "exfat-resize-$version.tar.gz.sha256")
          mkdir source-tree
          tar -xzf "$archive" -C source-tree
          source_directory=source-tree/exfat-resize-$version
          package_version=$(sed -n '1p' deb-artifacts/DEB_PACKAGE_VERSIONS)
          build_version=$(sed -n '2p' deb-artifacts/DEB_PACKAGE_VERSIONS)
          test "$package_version" = "$version"
          test "$build_version" = "$version"
          "$source_directory/tests/package/deb-install-test.sh" \
            deb-artifacts "$package_version" "$build_version" \
            "$source_directory"

  publish_draft:
    name: Create draft release
    needs:
      - build_source
      - build_deb
      - test_deb_ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: release-assets

      - name: Download Debian package artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: release-assets

      - name: Verify and assemble release artifacts
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_REF#v}
          archive=exfat-resize-$version.tar.gz
          checksum=$archive.sha256
          runtime=exfat-resize_${version}-1_amd64.deb
          development=libexfat-resize-dev_${version}-1_amd64.deb
          package_version=$(sed -n '1p' \
            release-assets/DEB_PACKAGE_VERSIONS)
          build_version=$(sed -n '2p' \
            release-assets/DEB_PACKAGE_VERSIONS)
          test "$package_version" = "$version"
          test "$build_version" = "$version"
          (cd release-assets && sha256sum --check "$checksum")
          (cd release-assets && sha256sum --check DEB_SHA256SUMS)
          cat "release-assets/$checksum" \
            release-assets/DEB_SHA256SUMS | sort -k2 \
            >release-assets/SHA256SUMS
          rm release-assets/DEB_SHA256SUMS \
            release-assets/DEB_PACKAGE_VERSIONS
          expected=$(printf '%s\n%s\n%s\n%s\n%s\n' \
            "$archive" "$checksum" SHA256SUMS "$runtime" "$development" |
            sort)
          actual=$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "workflow artifact contains an unexpected file set" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Create or update draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_REF#v}
          archive=exfat-resize-$version.tar.gz
          checksum=$archive.sha256
          runtime=exfat-resize_${version}-1_amd64.deb
          development=libexfat-resize-dev_${version}-1_amd64.deb
          title="exfat-resize $version"

          if is_draft=$(gh release view "$RELEASE_REF" \
            --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != true ]; then
              echo "refusing to modify published release $RELEASE_REF" >&2
              exit 1
            fi
            gh release edit "$RELEASE_REF" --draft --title "$title" --verify-tag
          else
            gh release create "$RELEASE_REF" --draft --generate-notes \
              --title "$title" --verify-tag
          fi

          gh release view "$RELEASE_REF" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [ -n "$asset" ]; then
                gh release delete-asset "$RELEASE_REF" "$asset" --yes
              fi
            done
          gh release upload "$RELEASE_REF" \
            "release-assets/$archive" "release-assets/$checksum" \
            release-assets/SHA256SUMS \
            "release-assets/$runtime" "release-assets/$development"

          expected=$(printf '%s\n%s\n%s\n%s\n%s\n' \
            "$archive" "$checksum" SHA256SUMS "$runtime" "$development" |
            sort)
          actual=$(gh release view "$RELEASE_REF" --json assets \
            --jq '.assets[].name' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "draft release contains an unexpected asset set" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

          mkdir downloaded-release-assets
          gh release download "$RELEASE_REF" \
            --dir downloaded-release-assets \
            --pattern "$archive" --pattern "$checksum" \
            --pattern SHA256SUMS --pattern "$runtime" \
            --pattern "$development"
          (cd downloaded-release-assets && sha256sum --check "$checksum")
          (cd downloaded-release-assets && sha256sum --check SHA256SUMS)
