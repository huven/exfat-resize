# SPDX-License-Identifier: MIT

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_source:
    name: Build source release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_REF: ${{ github.ref_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake g++

      - name: Validate release tag and commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          release_commit=$(git rev-parse --verify 'HEAD^{commit}')
          if ! git merge-base --is-ancestor \
            "$release_commit" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "release commit is not reachable from $DEFAULT_BRANCH" >&2
            exit 1
          fi
          tools/release-check.sh --require-signed-tag "$RELEASE_REF" "$release_commit"

      - name: Test release package
        run: make release-test

      - name: Verify source archive
        id: artifacts
        run: |
          set -euo pipefail
          version=${RELEASE_REF#v}
          archive=exfat-resize-$version.tar.gz
          test -f "dist/$archive"
          printf 'archive=%s\n' "$archive" >>"$GITHUB_OUTPUT"

      - name: Upload tested source archive
        uses: actions/upload-artifact@v4
        with:
          name: source-release-${{ github.ref_name }}-${{ github.run_id }}
          path: dist/${{ steps.artifacts.outputs.archive }}
          if-no-files-found: error
          overwrite: true

  build_linux:
    name: Linux binary archive
    needs: build_source
    permissions:
      contents: read
    uses: ./.github/workflows/linux-binary.yml
    with:
      source_artifact_name: source-release-${{ github.ref_name }}-${{ github.run_id }}
      binary_artifact_name: linux-release-${{ github.ref_name }}-${{ github.run_id }}
      expected_version: ${{ github.ref_name }}

  build_windows:
    name: Windows binary archive
    needs: build_source
    permissions:
      contents: read
    uses: ./.github/workflows/windows-binary.yml
    with:
      source_artifact_name: source-release-${{ github.ref_name }}-${{ github.run_id }}
      binary_artifact_name: windows-release-${{ github.ref_name }}-${{ github.run_id }}
      expected_version: ${{ github.ref_name }}

  build_macos:
    name: Unsigned macOS binary archive
    needs: build_source
    permissions:
      contents: read
    uses: ./.github/workflows/macos-binary.yml
    with:
      source_artifact_name: source-release-${{ github.ref_name }}-${{ github.run_id }}
      binary_artifact_name: macos-unsigned-${{ github.ref_name }}-${{ github.run_id }}
      expected_version: ${{ github.ref_name }}

  publish_draft:
    name: Create draft release
    needs: [build_source, build_linux, build_windows, build_macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-release-${{ github.ref_name }}-${{ github.run_id }}
          path: release-assets

      - name: Download tested Linux archive
        uses: actions/download-artifact@v4
        with:
          name: linux-release-${{ github.ref_name }}-${{ github.run_id }}
          path: release-assets

      - name: Download tested Windows archive
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}-${{ github.run_id }}
          path: release-assets

      - name: Verify release asset names
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_REF#v}
          source_archive=exfat-resize-$version.tar.gz
          linux_archive=exfat-resize-$version-linux-x86_64-glibc.tar.gz
          windows_archive=exfat-resize-$version-windows-x86_64.zip
          expected=$(
            printf '%s\n' "$source_archive" "$linux_archive" "$windows_archive" | sort
          )
          actual=$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "workflow artifact contains an unexpected file set" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Create or update draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_REF#v}
          source_archive=exfat-resize-$version.tar.gz
          linux_archive=exfat-resize-$version-linux-x86_64-glibc.tar.gz
          windows_archive=exfat-resize-$version-windows-x86_64.zip
          title="exfat-resize $version"

          if is_draft=$(gh release view "$RELEASE_REF" \
            --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != true ]; then
              echo "refusing to modify published release $RELEASE_REF" >&2
              exit 1
            fi
            gh release edit "$RELEASE_REF" --draft --title "$title" --verify-tag
          else
            gh release create "$RELEASE_REF" --draft --generate-notes --title "$title" --verify-tag
          fi

          gh release view "$RELEASE_REF" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [ -n "$asset" ]; then
                gh release delete-asset "$RELEASE_REF" "$asset" --yes
              fi
            done
          gh release upload "$RELEASE_REF" \
            "release-assets/$source_archive" \
            "release-assets/$linux_archive" \
            "release-assets/$windows_archive"

          expected=$(
            for asset in "$source_archive" "$linux_archive" "$windows_archive"; do
              digest=$(sha256sum "release-assets/$asset" | cut -d ' ' -f 1)
              printf '%s\tsha256:%s\n' "$asset" "$digest"
            done | sort
          )
          actual=$(
            gh release view "$RELEASE_REF" --json assets \
              --jq '.assets[] | [.name, .digest] | @tsv' |
              sort
          )
          if [ "$actual" != "$expected" ]; then
            echo "draft release asset names or digests do not match" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

  verify_macos_release:
    name: Verify signed macOS release asset
    needs: [build_source, publish_draft]
    runs-on: macos-15
    timeout-minutes: 30
    environment:
      name: macos-release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: read
    env:
      EXPECTED_TEAM_ID: X5X5M4XA99
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ github.ref_name }}

    steps:
      - name: Download tested source archive
        uses: actions/download-artifact@v4
        with:
          name: source-release-${{ github.ref_name }}-${{ github.run_id }}
          path: source-artifacts

      - name: Download signed macOS archive from draft release
        run: |
          set -euo pipefail
          is_draft=$(gh release view "$RELEASE_REF" --json isDraft --jq .isDraft)
          test "$is_draft" = true
          version=${RELEASE_REF#v}
          archive=exfat-resize-$version-macos-arm64.tar.gz
          mkdir signed-release-assets
          gh release download "$RELEASE_REF" --pattern "$archive" --dir signed-release-assets
          test -f "signed-release-assets/$archive"

          archive_sha256=$(shasum -a 256 "signed-release-assets/$archive" | awk '{ print $1 }')
          published_digest=$(
            gh release view "$RELEASE_REF" --json assets \
              --jq ".assets[] | select(.name == \"$archive\") | .digest"
          )
          test "$published_digest" = "sha256:$archive_sha256"
          printf 'signed release archive SHA-256: %s\n' "$archive_sha256"

      - name: Verify signed macOS archive
        run: |
          set -euo pipefail
          version=${RELEASE_REF#v}
          archive=signed-release-assets/exfat-resize-$version-macos-arm64.tar.gz
          source_archive=$(find source-artifacts -maxdepth 1 -type f \
            -name 'exfat-resize-*.tar.gz' -print)
          test -n "$source_archive"
          test "$(printf '%s\n' "$source_archive" | wc -l)" -eq 1

          mkdir source-tree
          tar -xzf "$source_archive" -C source-tree
          source_directory=$(find source-tree -mindepth 1 -maxdepth 1 \
            -type d -name 'exfat-resize-*' -print)
          test -n "$source_directory"
          test "$(printf '%s\n' "$source_directory" | wc -l)" -eq 1
          test "$(sed -n '1p' "$source_directory/.tarball-version")" = "$version"

          "$source_directory/tests/package/macos-binary-test.sh" \
            --developer-id-team "$EXPECTED_TEAM_ID" "$archive" "$source_directory"
